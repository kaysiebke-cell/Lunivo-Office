<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Das Zeichen von Lunivo-Office: Glühbirne, Federspitze, ein Trieb.

       Die Feder sagt, was man hier tut. Die Glühbirne sagt, wofür das
       Programm da ist — nicht fürs Tippen, sondern für den Einfall, der
       sonst am Schreiben scheitert. Der Trieb darin ist das, was daraus
       wird, wenn ihn niemand vorher abschneidet.

       Beides ist EINE Form, nicht zwei nebeneinander: Der Schaft der Feder
       ist zugleich der Sockel der Birne. Deshalb liegt das Ganze schräg —
       so, wie eine Feder in der Hand liegt.

       Die Farben laufen von unten nach oben durch: Marineblau an der
       Spitze, Türkis in der Mitte, Gold ganz oben am Glas. Der Verlauf
       steht in Werkzeug-Koordinaten (userSpaceOnUse) und dreht sich
       deshalb mit — die Spitze bleibt dunkel, egal wie das Zeichen liegt.

       Für 16 bis 24 Bildpunkte gibt es eine eigene, gröbere Zeichnung:
       symbole/icon-klein.svg. -->

  <defs>
    <radialGradient id="tafel" cx="0.5" cy="0.40" r="0.78">
      <stop offset="0"    stop-color="#FFFDF8"/>
      <stop offset="1"    stop-color="#F2EADA"/>
    </radialGradient>

    <!-- Der durchgehende Verlauf. y=182 ist die Federspitze, y=-212 das
         obere Ende des Glases. -->
    <linearGradient id="strich" gradientUnits="userSpaceOnUse" x1="0" y1="182" x2="0" y2="-212">
      <stop offset="0"    stop-color="#123566"/>
      <stop offset="0.30" stop-color="#1A62A0"/>
      <stop offset="0.58" stop-color="#2E9FBC"/>
      <stop offset="0.80" stop-color="#63BFA8"/>
      <stop offset="1"    stop-color="#DCA93F"/>
    </linearGradient>

    <linearGradient id="glas" gradientUnits="userSpaceOnUse" x1="-60" y1="-60" x2="70" y2="-200">
      <stop offset="0"    stop-color="#E6F4FA"/>
      <stop offset="0.55" stop-color="#F8FBFD"/>
      <stop offset="1"    stop-color="#FDF2D6"/>
    </linearGradient>

    <linearGradient id="feder" gradientUnits="userSpaceOnUse" x1="0" y1="182" x2="0" y2="-10">
      <stop offset="0"    stop-color="#E4EFF6"/>
      <stop offset="1"    stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#tafel)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="102.5"
        fill="none" stroke="#E4D8C0" stroke-width="3"/>

  <!-- Aufrecht gezeichnet, dann als Ganzes gekippt. Das ist der Grund für
       die negativen y-Werte: Der Nullpunkt sitzt am Übergang von Glas zu
       Feder, das Glas liegt darüber, die Spitze darunter. -->
  <g transform="translate(256,256) rotate(38) scale(1.0) translate(0,16)"
     stroke-linejoin="round" stroke-linecap="round">

    <!-- Das Glas -->
    <path d="M-40,-54 C-72,-76 -86,-104 -86,-130
             C-86,-178 -48,-212 0,-212
             C48,-212 86,-178 86,-130
             C86,-104 72,-76 40,-54 Z"
          fill="url(#glas)" stroke="url(#strich)" stroke-width="14"/>

    <!-- Der Trieb: Stiel und zwei Blätter -->
    <path d="M0,-56 C0,-96 -2,-136 0,-168"
          fill="none" stroke="url(#strich)" stroke-width="12"/>
    <path d="M0,-96 C-26,-100 -48,-116 -54,-136 C-32,-132 -10,-116 0,-96 Z"
          fill="#C9E8D9" stroke="url(#strich)" stroke-width="11"/>
    <path d="M0,-124 C24,-128 44,-144 50,-162 C30,-158 10,-142 0,-124 Z"
          fill="#CFEBD3" stroke="url(#strich)" stroke-width="11"/>

    <!-- Der Glanz auf dem Glas: ein Bogen und ein Punkt, wie man Glas
         zeichnet, seit es Zeichnungen von Glas gibt. -->
    <path d="M-46,-176 A58,58 0 0 1 -16,-198"
          fill="none" stroke="#8ED2E4" stroke-width="11"/>
    <circle cx="10" cy="-196" r="7" fill="#8ED2E4"/>

    <!-- Das Band. Es deckt den Übergang zu und ist deshalb deckend. -->
    <rect x="-43" y="-58" width="86" height="54" rx="12" fill="url(#strich)"/>
    <path d="M-33,-31 H33" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.30"/>

    <!-- Die Feder.

         Vier Dinge machen sie zu einer Feder und nicht zu einem Dreieck,
         und alle vier sind fein:

           · Die Feder ist BREITER als das Band. Sie hat Schultern: vom
             Band aus geht sie erst nach aussen, und erst danach zur
             Spitze. Eine Feder, die vom Band an nur schmaler wird, ist
             kein Federhalter, sondern ein Dolch.
           · Der Umriss ist dünn. Ein dicker Strich frisst das Weiß auf, das
             die Feder ausmacht.
           · Innen läuft eine zweite Linie mit — die Kanten der beiden
             Zinken. Ohne sie bleibt es eine leere Fläche.
           · Das Luftloch ist ein kleiner voller Punkt, kein Ring. Ein Ring
             ist bei dieser Größe ein Loch mit Rand um nichts herum. -->
    <path d="M-40,-6 C-50,2 -53,14 -51,30
             C-38,76 -21,130 0,180
             C21,130 38,76 51,30
             C53,14 50,2 40,-6 Z"
          fill="url(#feder)" stroke="url(#strich)" stroke-width="9"/>
    <path d="M-38,42 C-31,84 -17,136 0,170 C17,136 31,84 38,42"
          fill="none" stroke="url(#strich)" stroke-width="5" opacity="0.45"/>
    <circle cx="0" cy="20" r="8" fill="url(#strich)"/>
    <path d="M0,34 L0,172" fill="none" stroke="url(#strich)" stroke-width="5"/>
  </g>
</svg>
