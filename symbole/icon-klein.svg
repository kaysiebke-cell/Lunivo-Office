<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dasselbe Symbol für 16 bis 24 Bildpunkte.

       Bei dieser Größe ist jeder Strich zwei Bildpunkte breit. Die beiden
       Textzeilen und die feinen Absätze am Stift würden zu einem Fleck
       verschmelzen. Also bleibt nur, was die Sache ausmacht: das Blatt, ein
       großer Buchstabe und ein Stift ohne Beiwerk.

       Ein eigenes Bild für kleine Größen ist bei Symbolen üblich. Dieselbe
       Zeichnung herunterzurechnen spart Arbeit und kostet Erkennbarkeit. -->

  <rect width="512" height="512" rx="96" fill="#2F6FB5"/>

  <path d="M84 54h190l74 74v312a16 16 0 0 1-16 16H84a16 16 0 0 1-16-16V70a16 16 0 0 1 16-16z"
        fill="#FFFFFF"/>
  <path d="M274 54l74 74h-56a18 18 0 0 1-18-18z" fill="#B9CEE4"/>

  <g transform="translate(108.23 372.00) scale(0.16113 -0.16113)">
    <path d="M109 411H197L242 196Q284 147 369.0 114.0Q454 81 545 81Q832 81 832 317Q832 391 777.5 442.0Q723 493 606 533Q434 590 358.5 625.5Q283 661 231.0 709.0Q179 757 148.0 825.5Q117 894 117 994Q117 1171 237.5 1263.5Q358 1356 590 1356Q758 1356 962 1313V994H873L828 1178Q726 1252 590 1252Q467 1252 401.0 1206.5Q335 1161 335 1067Q335 1000 390.0 952.5Q445 905 562 868Q791 793 876.5 737.5Q962 682 1007.0 600.0Q1052 518 1052 407Q1052 -20 549 -20Q434 -20 314.5 -0.5Q195 19 109 51Z" fill="#2F6FB5"/>
  </g>

  <!-- Der Stift: nur Schaft und Spitze, kein Band -->
  <g>
    <path d="M330 372 L378 420 L490 308 L442 260 Z" fill="#D9A441"/>
    <path d="M300 450 L378 420 L330 372 Z" fill="#3C4A57"/>
  </g>
</svg>
