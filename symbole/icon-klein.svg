<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dasselbe Zeichen für 16 bis 24 Bildpunkte.

       Bei dieser Größe ist ein Strich ein halber Bildpunkt breit. Umriss,
       Schlitz, Luftloch und der Glanz auf dem Glas verschwämmen zu einem
       Fleck. Also bleibt nur, was die Sache ausmacht: eine runde Birne,
       eine Feder — ausgefüllt statt umrandet — und ein Trieb darin, grob
       genug, dass er noch etwas ist.

       Die Schultern bleiben auch hier, aber nur angedeutet. Sie sind das,
       woran man eine Feder erkennt — stehen sie zu weit heraus, wird aus
       der Feder ein Ballon.

       Auch das Band fällt weg. Es wäre breiter als die Feder und breiter
       als der Hals der Birne, und seine Ecken stünden nach beiden Seiten
       als kleine Nasen heraus. Stattdessen setzt die Feder oben genau da
       an, wo die Birne aufhört: eine einzige, durchgehende Form.

       Ein eigenes Bild für kleine Größen ist bei Symbolen üblich. Dieselbe
       Zeichnung herunterzurechnen spart Arbeit und kostet Erkennbarkeit. -->

  <defs>
    <linearGradient id="strich" gradientUnits="userSpaceOnUse" x1="0" y1="182" x2="0" y2="-206">
      <stop offset="0"    stop-color="#123566"/>
      <stop offset="0.34" stop-color="#1A62A0"/>
      <stop offset="0.62" stop-color="#2E9FBC"/>
      <stop offset="0.84" stop-color="#4FB6AF"/>
      <stop offset="1"    stop-color="#D9A63E"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="#FAF4E6"/>

  <g transform="translate(256,256) rotate(38) scale(1.06) translate(0,14)"
     fill="url(#strich)" stroke-linejoin="round">

    <!-- Glas und Feder, beide gefüllt -->
    <path d="M-44,-54 C-76,-78 -90,-106 -90,-132
             C-90,-180 -50,-214 0,-214
             C50,-214 90,-180 90,-132
             C90,-106 76,-78 44,-54 Z"/>
    <path d="M-44,-56 C-48,-36 -49,-18 -47,-2
             C-39,62 -21,133 0,180
             C21,133 39,62 47,-2
             C49,-18 48,-36 44,-56 Z"/>

    <!-- Der Trieb, in der Farbe der Fläche ausgespart -->
    <g fill="none" stroke="#FAF4E6" stroke-width="24" stroke-linecap="round">
      <path d="M0,-74 C0,-108 -2,-142 0,-174"/>
    </g>
    <path d="M-4,-104 C-30,-108 -54,-124 -60,-146 C-36,-142 -12,-124 -4,-104 Z"
          fill="#FAF4E6"/>
    <path d="M4,-134 C30,-138 52,-154 58,-174 C36,-170 12,-152 4,-134 Z"
          fill="#FAF4E6"/>
  </g>
</svg>
