<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640">
  <!-- Der Schriftzug fürs README und für alles, wo das Projekt sich
       vorstellt. Dasselbe Zeichen wie in icon.svg, nur ohne die Kachel
       darunter und mit dem Namen daneben.

       Die Schrift steht als <text> und nicht als Pfad: Diese Datei ist die
       Quelle, gesetzt wird sie einmal zu bilder/lunivo-office.png. Das PNG
       kommt ins README, damit der Schriftzug überall gleich aussieht — ein
       <text> nähme sonst die Schrift des jeweiligen Rechners. -->

  <defs>
    <radialGradient id="grund" cx="0.5" cy="0.36" r="0.72">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#F5EEE0"/>
    </radialGradient>
    <linearGradient id="strich" gradientUnits="userSpaceOnUse" x1="0" y1="182" x2="0" y2="-212">
      <stop offset="0"    stop-color="#123566"/>
      <stop offset="0.30" stop-color="#1A62A0"/>
      <stop offset="0.58" stop-color="#2E9FBC"/>
      <stop offset="0.80" stop-color="#63BFA8"/>
      <stop offset="1"    stop-color="#DCA93F"/>
    </linearGradient>
    <linearGradient id="glas" gradientUnits="userSpaceOnUse" x1="-60" y1="-60" x2="70" y2="-200">
      <stop offset="0"    stop-color="#E6F4FA"/>
      <stop offset="0.55" stop-color="#F8FBFD"/>
      <stop offset="1"    stop-color="#FDF2D6"/>
    </linearGradient>
    <linearGradient id="feder" gradientUnits="userSpaceOnUse" x1="0" y1="182" x2="0" y2="-10">
      <stop offset="0"    stop-color="#E4EFF6"/>
      <stop offset="1"    stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="640" fill="url(#grund)"/>

  <g transform="translate(500,248) rotate(38) scale(0.78) translate(0,16)"
     stroke-linejoin="round" stroke-linecap="round">
    <path d="M-40,-54 C-72,-76 -86,-104 -86,-130
             C-86,-178 -48,-212 0,-212
             C48,-212 86,-178 86,-130
             C86,-104 72,-76 40,-54 Z"
          fill="url(#glas)" stroke="url(#strich)" stroke-width="14"/>
    <path d="M0,-56 C0,-96 -2,-136 0,-168"
          fill="none" stroke="url(#strich)" stroke-width="12"/>
    <path d="M0,-96 C-26,-100 -48,-116 -54,-136 C-32,-132 -10,-116 0,-96 Z"
          fill="#C9E8D9" stroke="url(#strich)" stroke-width="11"/>
    <path d="M0,-124 C24,-128 44,-144 50,-162 C30,-158 10,-142 0,-124 Z"
          fill="#CFEBD3" stroke="url(#strich)" stroke-width="11"/>
    <path d="M-46,-176 A58,58 0 0 1 -16,-198"
          fill="none" stroke="#8ED2E4" stroke-width="11"/>
    <circle cx="10" cy="-196" r="7" fill="#8ED2E4"/>
    <rect x="-43" y="-58" width="86" height="54" rx="12" fill="url(#strich)"/>
    <path d="M-33,-31 H33" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.30"/>
    <path d="M-36,-6 C-34,58 -26,124 0,182 C26,124 34,58 36,-6 Z"
          fill="url(#feder)" stroke="url(#strich)" stroke-width="14"/>
    <circle cx="0" cy="36" r="11" fill="none" stroke="url(#strich)" stroke-width="9"/>
    <path d="M0,54 L0,168" fill="none" stroke="url(#strich)" stroke-width="9"/>
  </g>

  <text x="500" y="500" text-anchor="middle"
        font-family="Liberation Sans, Arial, Helvetica, sans-serif"
        font-size="104" letter-spacing="1.5" fill="#173A6D">Lunivo-Office</text>
  <text x="500" y="568" text-anchor="middle"
        font-family="Liberation Sans, Arial, Helvetica, sans-serif"
        font-size="42" letter-spacing="2.5" fill="#2C6C9E">Ein Raum für Worte</text>
</svg>
