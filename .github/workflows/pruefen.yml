# Was bei jedem Push geprüft wird: die Tests der nativen Qt-Fassung (ohne Bildschirm, offscreen).
name: Prüfen

on: [push, pull_request]

jobs:
  pruefen:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Systempakete für Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libgl1
      - name: Abhängigkeiten
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q tests
